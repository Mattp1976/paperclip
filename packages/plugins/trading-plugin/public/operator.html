<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paperclip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=SF+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fafafa;--surface:#fff;--border:#e5e5e7;
  --text:#1d1d1f;--secondary:#86868b;--tertiary:#aeaeb2;
  --green:#34c759;--red:#ff3b30;--blue:#007aff;--orange:#ff9500;
  --font:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','Helvetica Neue',sans-serif;
  --mono:'SF Mono','Menlo','Monaco','Courier New',monospace;
}
html{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
body{max-width:720px;margin:0 auto;padding:40px 24px 80px}

/* Status bar */
.status-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}
.status-left{display:flex;align-items:center;gap:12px}
.wordmark{font-size:15px;font-weight:600;letter-spacing:-0.3px;color:var(--text)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.status-dot.error{background:var(--red)}
.status-dot.degraded{background:var(--orange)}
.status-label{font-size:12px;color:var(--secondary);font-weight:400}
.status-right{font-size:12px;color:var(--tertiary);font-family:var(--mono)}
</style>
</head>
<body>
<style>
/* Hero */
.hero{text-align:center;margin-bottom:48px}
.hero-value{font-size:56px;font-weight:300;letter-spacing:-2px;line-height:1.1;margin-bottom:4px;transition:color 0.3s}
.hero-label{font-size:13px;color:var(--secondary);font-weight:400;margin-bottom:16px}
.hero-detail{display:flex;justify-content:center;gap:32px}
.hero-stat{text-align:center}
.hero-stat-value{font-size:20px;font-weight:500;letter-spacing:-0.5px}
.hero-stat-label{font-size:11px;color:var(--tertiary);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}

/* Nav */
.nav{display:flex;justify-content:center;gap:8px;margin-bottom:40px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:10}
.nav-btn{padding:6px 16px;border-radius:20px;border:none;background:transparent;color:var(--secondary);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all 0.2s}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{background:var(--text);color:#fff}

/* Timeline */
.view{display:none}.view.active{display:block}
.timeline{list-style:none}
.timeline-item{padding:20px 0;border-bottom:1px solid var(--border)}
.timeline-item:last-child{border-bottom:none}
.timeline-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.timeline-agent{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:2px 8px;border-radius:4px;background:#f5f5f7;color:var(--secondary)}
.timeline-time{font-size:12px;color:var(--tertiary);font-family:var(--mono)}
.timeline-body{font-size:15px;line-height:1.6;color:var(--text)}
.timeline-body strong{font-weight:600}
.timeline-detail{margin-top:8px;font-size:13px;color:var(--secondary);font-family:var(--mono)}
.timeline-pnl{font-weight:600}
.timeline-pnl.pos{color:var(--green)}
.timeline-pnl.neg{color:var(--red)}
/* Mind view */
.hypothesis-card{padding:24px 0;border-bottom:1px solid var(--border)}
.hypothesis-card:last-child{border-bottom:none}
.hyp-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.hyp-name{font-size:17px;font-weight:600;letter-spacing:-0.3px;line-height:1.3}
.hyp-confidence{font-size:13px;font-family:var(--mono);color:var(--secondary)}
.hyp-meta{display:flex;gap:12px;margin-bottom:10px}
.hyp-tag{font-size:11px;font-weight:500;color:var(--secondary);background:#f5f5f7;padding:2px 8px;border-radius:4px}
.hyp-tag.active{background:rgba(52,199,89,0.1);color:var(--green)}
.hyp-tag.testing{background:rgba(255,149,0,0.1);color:var(--orange)}
.hyp-description{font-size:14px;line-height:1.65;color:#424245}

/* Position cards in Now view */
.position{padding:16px 0;border-bottom:1px solid var(--border)}
.position:last-child{border-bottom:none}
.pos-header{display:flex;align-items:baseline;justify-content:space-between}
.pos-symbol{font-size:17px;font-weight:600;letter-spacing:-0.3px}
.pos-pnl{font-size:17px;font-weight:500;font-family:var(--mono)}
.pos-detail{font-size:13px;color:var(--secondary);margin-top:4px}
.pos-reasoning{font-size:14px;color:#424245;margin-top:8px;line-height:1.5;font-style:italic}

/* Section headers */
.section-header{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--tertiary);margin-bottom:16px;margin-top:32px}
.section-header:first-child{margin-top:0}

/* Risk banner */
.risk-banner{background:#fffbeb;border:1px solid #fef3c7;border-radius:12px;padding:16px 20px;margin-bottom:24px;font-size:14px;color:#92400e;line-height:1.5}
.risk-banner strong{font-weight:600}

/* Empty state */
.empty{padding:40px 0;text-align:center;color:var(--tertiary);font-size:14px}

/* Subtle fade */
.fade-in{animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
<!-- Status bar -->
<div class="status-bar">
  <div class="status-left">
    <span class="wordmark">Paperclip</span>
    <div class="status-dot" id="statusDot"></div>
    <span class="status-label" id="statusLabel">Connecting</span>
  </div>
  <div class="status-right" id="clock"></div>
</div>

<!-- Hero -->
<div class="hero">
  <div class="hero-value" id="heroValue">—</div>
  <div class="hero-label">Portfolio Value</div>
  <div class="hero-detail">
    <div class="hero-stat">
      <div class="hero-stat-value" id="heroReturn">—</div>
      <div class="hero-stat-label">Return</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-value" id="heroPositions">—</div>
      <div class="hero-stat-label">Open</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-value" id="heroWinRate">—</div>
      <div class="hero-stat-label">Win Rate</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-value" id="heroSharpe">—</div>
      <div class="hero-stat-label">Sharpe</div>
    </div>
  </div>
</div>

<!-- Navigation -->
<nav class="nav">
  <button class="nav-btn active" data-view="now">Now</button>
  <button class="nav-btn" data-view="mind">Mind</button>
  <button class="nav-btn" data-view="history">History</button>
</nav>

<!-- Risk banner -->
<div class="risk-banner" id="riskBanner" style="display:none"></div>

<!-- Now view -->
<div class="view active" id="view-now">
  <div class="section-header">Open Positions</div>
  <div id="positionsList"></div>
  <div class="section-header">Recent Activity</div>
  <ul class="timeline" id="activityTimeline"></ul>
</div>

<!-- Mind view -->
<div class="view" id="view-mind">
  <div class="section-header">Active Hypotheses</div>
  <div id="hypothesesList"></div>
</div>

<!-- History view -->
<div class="view" id="view-history">
  <div class="section-header">Closed Trades</div>
  <ul class="timeline" id="historyTimeline"></ul>
</div>
<script>
const $=id=>document.getElementById(id);
const fmtUSD=v=>'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

// Navigation
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    const view=$('view-'+btn.dataset.view);
    if(view){view.classList.add('active');view.classList.add('fade-in');}
  });
});

// Clock
setInterval(()=>{
  $('clock').textContent=new Date().toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
},1000);

// Time ago helper
function timeAgo(ts){
  const ms=Date.now()-new Date(ts).getTime();
  const mins=Math.floor(ms/60000);
  if(mins<1)return 'just now';
  if(mins<60)return mins+'m ago';
  const hrs=Math.floor(mins/60);
  if(hrs<24)return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}
// Build a narrative sentence from a position
function positionNarrative(p){
  const dir=p.direction;
  const entry=Number(p.entry_price);
  const current=Number(p.current_price||0);
  const pnl=dir==='long'?(current-entry)/entry*100:(entry-current)/entry*100;
  const pnlSign=pnl>=0?'+':'';
  const hypName=p.hypothesis_name||'';
  return {pnl, pnlFormatted: pnlSign+pnl.toFixed(2)+'%', hypName};
}

// Build narrative for a closed trade
function tradeNarrative(t){
  const pnl=parseFloat(t.pnl||0);
  const pnlPct=parseFloat(t.pnl_pct||0);
  const won=pnl>0;
  const dir=t.direction;
  const reason=t.exit_reason||'unknown';
  
  let verb='';
  if(reason==='stop_loss') verb='was stopped out of';
  else if(reason==='take_profit') verb='took profit on';
  else if(reason==='trailing_stop') verb='trailed out of';
  else if(reason==='time_limit') verb='timed out of';
  else verb='closed';

  let body='I '+verb+' a <strong>'+dir+'</strong> position on <strong>'+t.symbol+'</strong>. ';
  body+='Entered at '+fmtUSD(t.entry_price)+', exited at '+fmtUSD(t.exit_price)+'. ';

  if(t.hypothesis_name){
    body+='The thesis was "'+t.hypothesis_name+'". ';
  }

  const holdMs=new Date(t.exit_time)-new Date(t.entry_time);
  const holdHrs=(holdMs/3600000).toFixed(1);
  body+='Held for '+holdHrs+' hours.';

  return {body, pnl, pnlPct, won, reason, symbol: t.symbol, direction: dir};
}
// Build activity timeline from agent logs
function logNarrative(log){
  const agent=log.agent_name||'';
  const msg=log.message||'';
  
  // Map agent names to readable roles
  const roles={
    'scanner_crypto':'Scanner','hypothesis_agent':'Analyst',
    'backtest_agent':'Backtester','paper_trader':'Trader',
    'exit_engine':'Risk','risk_manager':'Risk'
  };
  const role=roles[agent]||agent;

  // Build human-readable narrative from log message
  let narrative=msg;
  if(agent==='scanner_crypto'&&msg.includes('Scan cycle complete')){
    const match=msg.match(/(\d+)\/(\d+)/);
    if(match) narrative='Scanned '+match[1]+' markets for signals.';
  }else if(agent==='hypothesis_agent'&&msg.includes('Skipped')){
    narrative='At capacity — all hypothesis slots are filled. Waiting for space.';
  }else if(agent==='hypothesis_agent'&&msg.includes('Generated')){
    narrative='Formed a new hypothesis from current market signals.';
  }else if(agent==='backtest_agent'&&msg.includes('Cycle complete')){
    const match=msg.match(/(\d+) tested, (\d+) promoted/);
    if(match) narrative='Backtested '+match[1]+' hypothesis'+(match[1]!=='1'?'es':'')+'. '+match[2]+' promoted to paper trading.';
  }else if(agent==='paper_trader'&&msg.includes('Cycle complete')){
    narrative='Checked all open positions and evaluated new entries.';
  }

  return {role, narrative, time: log.created_at};
}

async function refreshData(){
  try{
    const [healthR,equityR,posR,tradesR,perfR,corrR,hypR,logsR,riskR]=await Promise.all([
      fetch('/api/health').then(r=>r.json()).catch(()=>null),
      fetch('/api/portfolio/equity').then(r=>r.json()).catch(()=>null),
      fetch('/api/paper-trades').then(r=>r.json()).catch(()=>null),
      fetch('/api/positions').then(r=>r.json()).catch(()=>null),
      fetch('/api/performance/overview').then(r=>r.json()).catch(()=>null),
      fetch('/api/correlation/report').then(r=>r.json()).catch(()=>null),
      fetch('/api/hypotheses').then(r=>r.json()).catch(()=>null),
      fetch('/api/agent-logs').then(r=>r.json()).catch(()=>null),
      fetch('/api/performance/risk-metrics').then(r=>r.json()).catch(()=>null),
    ]);
    // Status
    if(healthR){
      const ok=healthR.status==='ok'||healthR.status==='healthy';
      $('statusDot').className='status-dot'+(ok?'':' error');
      $('statusLabel').textContent=ok?'Running':'Issue detected';
    }

    // Hero numbers
    if(equityR&&equityR.length){
      const latest=equityR[equityR.length-1];
      const first=equityR[0];
      const equity=parseFloat(latest.total_equity||10000);
      const startEq=parseFloat(first.total_equity||10000);
      const returnPct=((equity-startEq)/startEq*100);
      $('heroValue').textContent=fmtUSD(equity);
      $('heroValue').style.color=returnPct>=0?'var(--text)':'var(--red)';
      const rEl=$('heroReturn');
      rEl.textContent=(returnPct>=0?'+':'')+returnPct.toFixed(2)+'%';
      rEl.style.color=returnPct>=0?'var(--green)':'var(--red)';
    }
    if(tradesR){
      $('heroPositions').textContent=(Array.isArray(tradesR)?tradesR:[]).length;
    }
    if(perfR){
      $('heroWinRate').textContent=(perfR.winRate||0)+'%';
    }
    if(riskR&&riskR.sharpeRatio!=null){
      $('heroSharpe').textContent=Number(riskR.sharpeRatio).toFixed(2);
    }

    // Risk banner
    if(corrR&&corrR.warnings&&corrR.warnings.length){
      const banner=$('riskBanner');
      const topWarning=corrR.warnings[0];
      banner.innerHTML='<strong>Risk notice:</strong> '+topWarning;
      banner.style.display='block';
    }
    // Now view — Positions
    if(tradesR){
      const positions=Array.isArray(tradesR)?tradesR:[];
      let pH='';
      if(!positions.length){
        pH='<div class="empty">No open positions. The system is observing.</div>';
      }
      positions.forEach(p=>{
        const n=positionNarrative(p);
        const pnlClass=n.pnl>=0?'pos':'neg';
        pH+='<div class="position">';
        pH+='<div class="pos-header"><span class="pos-symbol">'+p.symbol+' <span style="font-weight:400;font-size:13px;color:var(--secondary)">'+p.direction+'</span></span>';
        pH+='<span class="pos-pnl timeline-pnl '+pnlClass+'">'+n.pnlFormatted+'</span></div>';
        pH+='<div class="pos-detail">Entry '+fmtUSD(p.entry_price)+' → Current '+fmtUSD(p.current_price||0);
        if(p.stop_loss) pH+=' · SL '+fmtUSD(p.stop_loss);
        if(p.take_profit) pH+=' · TP '+fmtUSD(p.take_profit);
        pH+='</div>';
        if(n.hypName){
          pH+='<div class="pos-reasoning">"'+n.hypName+'"</div>';
        }
        pH+='</div>';
      });
      $('positionsList').innerHTML=pH;
    }

    // Now view — Activity timeline from agent logs
    if(logsR){
      const logs=Array.isArray(logsR)?logsR:[];
      // Deduplicate consecutive identical messages
      const deduped=[];
      let lastMsg='';
      logs.forEach(l=>{
        const key=l.agent_name+':'+l.message;
        if(key!==lastMsg){deduped.push(l);lastMsg=key;}
      });

      let tH='';
      deduped.slice(0,15).forEach(l=>{
        const n=logNarrative(l);
        tH+='<li class="timeline-item">';
        tH+='<div class="timeline-meta"><span class="timeline-agent">'+n.role+'</span><span class="timeline-time">'+timeAgo(n.time)+'</span></div>';
        tH+='<div class="timeline-body">'+n.narrative+'</div>';
        tH+='</li>';
      });
      $('activityTimeline').innerHTML=tH||'<li class="empty">No recent activity</li>';
    }
    // Mind view — Hypotheses
    if(hypR){
      const hyps=Array.isArray(hypR)?hypR:[];
      let hH='';
      if(!hyps.length){
        hH='<div class="empty">The system is observing markets. No hypotheses formed yet.</div>';
      }
      hyps.forEach(h=>{
        const statusClass=h.status==='paper_trading'?'active':h.status==='testing'||h.status==='backtesting'?'testing':'';
        hH+='<div class="hypothesis-card">';
        hH+='<div class="hyp-header"><span class="hyp-name">'+h.name+'</span>';
        hH+='<span class="hyp-confidence">'+h.confidence+'%</span></div>';
        hH+='<div class="hyp-meta">';
        hH+='<span class="hyp-tag '+statusClass+'">'+h.status.replace(/_/g,' ')+'</span>';
        hH+='<span class="hyp-tag">'+h.strategy_type+'</span>';
        hH+='<span class="hyp-tag">'+h.asset_class+'</span>';
        hH+='</div>';
        if(h.description){
          hH+='<div class="hyp-description">'+h.description+'</div>';
        }
        hH+='</div>';
      });
      $('hypothesesList').innerHTML=hH;
    }

    // History view — Closed trades as narrative
    if(posR){
      const allTrades=Array.isArray(posR)?posR:[];
      const closed=allTrades.filter(t=>t.status==='closed');
      let cH='';
      if(!closed.length){
        cH='<li class="empty">No closed trades yet. The system is building its track record.</li>';
      }
      closed.forEach(t=>{
        const n=tradeNarrative(t);
        const pnlClass=n.won?'pos':'neg';
        cH+='<li class="timeline-item">';
        cH+='<div class="timeline-meta">';
        cH+='<span class="timeline-agent">Trader</span>';
        cH+='<span class="timeline-pnl '+pnlClass+'">'+(n.pnl>=0?'+':'')+fmtUSD(n.pnl)+' ('+n.pnlPct.toFixed(2)+'%)</span>';
        cH+='<span class="timeline-time">'+timeAgo(t.exit_time)+'</span>';
        cH+='</div>';
        cH+='<div class="timeline-body">'+n.body+'</div>';
        cH+='<div class="timeline-detail">Exit: '+n.reason.replace(/_/g,' ')+'</div>';
        cH+='</li>';
      });
      $('historyTimeline').innerHTML=cH;
    }

  }catch(e){console.error('Refresh error:',e);}
}

refreshData();
setInterval(refreshData,30000);
</script>
</body>
</html>
