<?xml version="1.0" encoding="UTF-8"?>
<!--
  Orqestra mark.
  A quarter-note glyph. Reads as the letter Q (silent centre of "orQestra")
  and as the elemental unit of an orchestral score.

  Drawn on a 100x100 grid. Stroke weight is calibrated to remain crisp at
  16px (favicon) and at 1024px (app icon).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  fill="none"
  role="img"
  aria-label="Orqestra"
>
  <!-- The note head — a perfect open circle. -->
  <circle
    cx="44"
    cy="42"
    r="22"
    stroke="currentColor"
    stroke-width="4"
  />
  <!-- The stem — a fine vertical line that becomes the descender of Q. -->
  <line
    x1="64"
    y1="50"
    x2="64"
    y2="92"
    stroke="currentColor"
    stroke-width="4"
    stroke-linecap="square"
  />
</svg>
