<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orqestra" />
    <title>Orqestra</title>
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const key = "paperclip.theme";
        const versionKey = "paperclip.themeVersion";
        // Bump this when the palette changes to reset all users onto the
        // new default (light) so they experience the redesigned look first.
        const paletteVersion = "pastel-2026-04";
        const darkThemeColor = "#faf7f2";
        const lightThemeColor = "#faf7f2";
        try {
          // URL-based theme reset: visiting ?theme=light or ?theme=dark will
          // overwrite the stored preference and strip the query param so
          // reloads stay clean. Useful when the toggle isn't reachable.
          const params = new URLSearchParams(window.location.search);
          const override = params.get("theme");
          if (override === "light" || override === "dark") {
            window.localStorage.setItem(key, override);
            window.localStorage.setItem(versionKey, paletteVersion);
            params.delete("theme");
            const cleaned = params.toString();
            const newUrl =
              window.location.pathname +
              (cleaned ? "?" + cleaned : "") +
              window.location.hash;
            window.history.replaceState({}, "", newUrl);
          }
          // One-time migration: when the palette version bumps, reset any
          // stored dark preference so users see the pastel light palette.
          const storedVersion = window.localStorage.getItem(versionKey);
          if (storedVersion !== paletteVersion) {
            window.localStorage.setItem(key, "light");
            window.localStorage.setItem(versionKey, paletteVersion);
          }
          const stored = window.localStorage.getItem(key);
          const theme = stored === "light" || stored === "dark" ? stored : "light";
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
